name: Security

# Checks that run on every change and once a week (new vulnerabilities are published all the time):
#   - pip-audit: the Python libraries in requirements.txt against the Python Packaging Advisory Database / OSV
#   - Bandit: a Python security linter (settings in .bandit); fails on medium or high severity findings
#   - CodeQL: GitHub's code scanner, results under the Security tab. Free for public repositories only, so it's
#     skipped while the repository is private (Bandit and pip-audit keep running either way)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"     # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check libraries for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --desc

      - name: Check the code with Bandit
        run: |
          pip install bandit==1.9.4
          bandit -r dopplesite wsgi.py -ll --ini .bandit

  codeql:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
